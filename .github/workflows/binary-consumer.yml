name: Koma to Actron migration isolation
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  binary:
    name: Migration isolation (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: jvm, os: ubuntu-latest}
          - {target: js, os: ubuntu-latest}
          - {target: wasm, os: ubuntu-latest}
          - {target: ios, os: macos-26}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run a frozen Koma client alongside Actron
        run: scripts/verify-binary-consumer.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-consumer-${{ matrix.target }}
          path: verification/binary-consumer/**/build/reports
          if-no-files-found: ignore
