# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Kotlin
kotlin.code.style=official
# kotlin.js.compiler=ir // Deprecated: the IR compiler is the default and only option since Kotlin 2.0
# MPP
kotlin.mpp.enableCInteropCommonization=true
# Work around Kotlin/Native cache build failures on iOS simulator test linking.
kotlin.native.cacheKind.iosSimulatorArm64=none
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Fork publishing (roman-n1/koma). Publications use these coordinates instead of the
# official io.github.koma-kt ones, so fork artifacts never collide with official Koma.
# Remove these three lines to publish with the modules' own group and version again.
koma.fork.group=io.github.roman-n1
koma.fork.version=4.0.0-sc.1
koma.fork.url=https://github.com/roman-n1/koma/
