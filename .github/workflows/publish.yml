name: Publish
on:
  release:
    types: [ prereleased ]
jobs:
  test:
    uses: ./.github/workflows/gradle.yml
  consumer:
    uses: ./.github/workflows/published-consumer.yml
  publish:
    # GitHub-only releases must not attempt a Maven upload. Enable after configuring secrets.
    if: vars.MAVEN_CENTRAL_PUBLISH_ENABLED == 'true'
    name: Release build and publish
    needs: [test, consumer]
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY_CONTENTS }}
